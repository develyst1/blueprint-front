# Push to `sit` → build on GitHub (Linux x86-64) → deploy to the ReadyIDC box as app `blueprint-sit`.
# The server checks health and rolls back by itself if the new build does not come up.
# Secrets (repo settings): DEPLOY_SSH_KEY (CI-only key; the server lets it run deploy only),
# DEPLOY_KNOWN_HOSTS (the server's host key). Set up by Otto, 2026-10-31 (workspace SERVER-FACTS S2).
name: deploy-sit

on:
  push:
    branches: [sit]
  workflow_dispatch:

concurrency:
  group: deploy-sit
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run --if-present typecheck
      - run: bun run --if-present lint
      # `build` runs next build and copies .next/static + public into .next/standalone.
      - run: bun run build
      # Playwright isolation spec against this build (uses the runner's Google Chrome, channel "chrome").
      # A failure stops the deploy. states/required specs need blueprint-back too: not run here yet.
      - run: bun run test:isolation
      - run: tar -czf app.tgz -C .next/standalone .
      - name: deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes deploy@43.228.86.89 blueprint-sit < app.tgz
